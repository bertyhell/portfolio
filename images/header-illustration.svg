<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" role="img" aria-labelledby="t">
  <title id="t">Ilustración: tres mujeres conectadas por historias, con un globo terráqueo de fondo</title>
  <defs>
    <clipPath id="arch"><path d="M0 200 A200 200 0 0 1 400 200 V442 Q400 460 382 460 H18 Q0 460 0 442 Z"/></clipPath>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fffefa" opacity=".18"/></pattern>
  </defs>
  <g clip-path="url(#arch)">
    <rect width="400" height="460" fill="#234f43"/>
    <rect width="400" height="460" fill="url(#dots)"/>

    <!-- globe -->
    <circle cx="200" cy="190" r="128" fill="#d8ed8b"/>
    <g fill="none" stroke="#234f43" stroke-width="1.6" opacity=".28">
      <ellipse cx="200" cy="190" rx="128" ry="44"/>
      <ellipse cx="200" cy="190" rx="128" ry="92"/>
      <ellipse cx="200" cy="190" rx="44" ry="128"/>
      <ellipse cx="200" cy="190" rx="92" ry="128"/>
      <line x1="72" y1="190" x2="328" y2="190"/>
      <line x1="200" y1="62" x2="200" y2="318"/>
    </g>

    <!-- connecting threads between the speech bubbles -->
    <g fill="none" stroke="#fffefa" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity=".9">
      <path d="M92 112 Q140 60 200 74"/>
      <path d="M262 72 Q320 70 322 118"/>
    </g>

    <!-- bubble: story (lines of text) -->
    <g transform="translate(34 100)">
      <rect width="92" height="58" rx="16" fill="#fffefa"/>
      <path d="M22 58 L18 74 L38 58 Z" fill="#fffefa"/>
      <rect x="16" y="17" width="58" height="6" rx="3" fill="#234f43"/>
      <rect x="16" y="29" width="44" height="6" rx="3" fill="#234f43" opacity=".45"/>
      <rect x="16" y="41" width="52" height="6" rx="3" fill="#234f43" opacity=".45"/>
    </g>

    <!-- bubble: video -->
    <g transform="translate(176 44)">
      <rect width="88" height="56" rx="16" fill="#d36a45"/>
      <path d="M58 56 L66 72 L46 56 Z" fill="#d36a45"/>
      <circle cx="44" cy="28" r="15" fill="#fffefa"/>
      <path d="M39 20 L52 28 L39 36 Z" fill="#d36a45"/>
    </g>

    <!-- bubble: heart / impact -->
    <g transform="translate(296 112)">
      <rect width="72" height="56" rx="16" fill="#fffefa"/>
      <path d="M48 56 L54 72 L36 56 Z" fill="#fffefa"/>
      <path d="M36 42 C20 31 22 18 30 17 C34 16.5 36 20 36 22 C36 20 38 16.5 42 17 C50 18 52 31 36 42 Z" fill="#d36a45"/>
    </g>

    <!-- ground band behind figures -->
    <path d="M-10 372 Q200 330 410 372 V470 H-10 Z" fill="#1c4037"/>

    <!-- figure left: woman with notebook -->
    <g>
      <path d="M58 380 C58 300 82 272 112 272 C142 272 164 300 164 380 Z" fill="#d36a45"/>
      <rect x="102" y="250" width="20" height="28" rx="8" fill="#8a5a3c"/>
      <circle cx="112" cy="234" r="27" fill="#8a5a3c"/>
      <path d="M84 236 C80 200 140 196 140 230 C134 214 112 208 98 222 C94 238 92 252 84 262 Z" fill="#17221f"/>
      <g fill="#17221f"><circle cx="104" cy="238" r="2.4"/><circle cx="122" cy="238" r="2.4"/></g>
      <path d="M106 248 Q113 253 120 248" stroke="#17221f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <rect x="120" y="306" width="34" height="42" rx="4" fill="#fffefa" transform="rotate(-8 137 327)"/>
      <path d="M126 318 h20 M126 328 h16 M126 338 h18" stroke="#234f43" stroke-width="3" stroke-linecap="round" transform="rotate(-8 137 327)"/>
    </g>

    <!-- figure right: woman with camera -->
    <g>
      <path d="M236 380 C236 304 258 276 290 276 C322 276 344 304 344 380 Z" fill="#fffefa"/>
      <rect x="280" y="254" width="20" height="28" rx="8" fill="#e0a77e"/>
      <circle cx="290" cy="236" r="26" fill="#e0a77e"/>
      <path d="M262 232 C262 204 318 202 318 232 C318 252 326 268 334 278 C318 280 312 262 312 240 C300 230 282 228 268 238 C268 262 262 276 248 280 C258 266 262 250 262 232 Z" fill="#6b3d26"/>
      <g fill="#17221f"><circle cx="281" cy="240" r="2.4"/><circle cx="299" cy="240" r="2.4"/></g>
      <path d="M283 250 Q290 255 297 250" stroke="#17221f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <rect x="248" y="300" width="46" height="32" rx="7" fill="#17221f"/>
      <circle cx="271" cy="316" r="10" fill="#d8ed8b"/>
      <circle cx="271" cy="316" r="5" fill="#17221f"/>
      <rect x="256" y="294" width="14" height="8" rx="2" fill="#17221f"/>
    </g>

    <!-- figure centre: woman in front -->
    <g>
      <path d="M134 400 C134 318 162 288 200 288 C238 288 266 318 266 400 Z" fill="#d8ed8b"/>
      <path d="M134 400 C134 318 162 288 200 288 C238 288 266 318 266 400 Z" fill="none" stroke="#234f43" stroke-width="3"/>
      <rect x="189" y="264" width="22" height="30" rx="9" fill="#5b3a29"/>
      <circle cx="200" cy="246" r="29" fill="#5b3a29"/>
      <circle cx="200" cy="208" r="17" fill="#17221f"/>
      <path d="M171 244 C170 216 230 216 229 244 C220 230 182 230 171 244 Z" fill="#17221f"/>
      <g fill="#17221f"><circle cx="190" cy="250" r="2.6"/><circle cx="210" cy="250" r="2.6"/></g>
      <path d="M192 261 Q200 267 208 261" stroke="#17221f" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- small sparkles -->
    <g fill="#d8ed8b">
      <path d="M352 64 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
      <path d="M52 66 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 Z"/>
    </g>
  </g>
</svg>
